name: Build LKM for yzhlSU
on:
  workflow_call:
    inputs:
      expected_size:
        description: 'Primary Manager signing certificate size'
        required: true
        type: string
      expected_hash:
        description: 'Primary Manager signing certificate SHA-256'
        required: true
        type: string
      expected_size2:
        description: 'Second expected signature size (for PR builds)'
        required: false
        default: ''
        type: string
      expected_hash2:
        description: 'Second expected signature hash (for PR builds)'
        required: false
        default: ''
        type: string
jobs:
  build-lkm:
    strategy:
      matrix:
        kmi:
          # This module is an input of the standalone Windows image patcher.
          # The Android Manager/daemon does not embed any KMI.
          - android16-6.12
    uses: ./.github/workflows/ddk-lkm.yml
    with:
      kmi: ${{ matrix.kmi }}
      expected_size: ${{ inputs.expected_size }}
      expected_hash: ${{ inputs.expected_hash }}
      build_x86_64: false
      expected_size2: ${{ inputs.expected_size2 || '' }}
      expected_hash2: ${{ inputs.expected_hash2 || '' }}
